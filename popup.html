<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Short Video Clipper</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<h1>保存视频</h1>
<p id="status" role="status">正在检测…</p>
<form id="form" hidden>
  <label id="mediaRow">视频<select id="media"></select></label>
  <label>质量<select id="quality"></select></label>
  <label>文件名<span class="name"><input id="filename" maxlength="100" autocomplete="off" spellcheck="false"><span id="ext">.mp4</span></span></label>
  <label class="check"><input type="checkbox" id="saveAs">保存时选择位置</label>
  <button id="save">保存</button>
</form>
<button type="button" id="rescan">重新检测</button>
<script src="core.js"></script>
<script src="popup.js"></script>
</body>
</html>
